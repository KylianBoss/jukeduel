<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jukeduel · écran</title>
<style>
  :root { color-scheme: dark; --muted: #b3b3b3; --accent: #1ed760; }
  * { box-sizing: border-box; }
  /* pas de pochette floutée en fond : les règles de Spotify interdisent de modifier les pochettes */
  html, body { height: 100%; margin: 0; overflow: hidden; background: radial-gradient(circle at 20% 35%, #1c2b22, #000 75%); color: #fff; font: 2.2vh/1.3 system-ui, sans-serif; cursor: none; }
  main { display: grid; grid-template-columns: 1.15fr 1fr .75fr; gap: 6vh; height: 100%; padding: 7vh 8vh; align-items: center; }
  img { object-fit: cover; background: #222; }
  .now img { width: 100%; max-width: 58vh; aspect-ratio: 1; border-radius: 2vh; box-shadow: 0 3vh 8vh #000a; }
  .now h1 { margin: 3vh 0 .5vh; font-size: 5.5vh; line-height: 1.1; }
  .muted { color: var(--muted); }
  .by { margin-top: 1.5vh; font-size: 2.8vh; color: var(--accent); }
  .rank { display: flex; align-items: baseline; gap: 1.5vh; padding: 1.2vh 0; border-bottom: 1px solid #fff2; font-size: 3vh; }
  .rank:first-of-type { font-size: 4vh; }
  .rank .pos { min-width: 3.5vh; color: var(--muted); font-weight: 800; }
  .rank b { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .rank .pts { color: var(--accent); font-weight: 800; }
  .bar { max-width: 58vh; height: .8vh; margin-top: 3vh; background: #fff3; border-radius: 1vh; overflow: hidden; }
  .bar i { display: block; width: 0; height: 100%; background: #fff; }
  h2 { margin: 0 0 2.5vh; font-size: 2.2vh; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); }
  h2 + .cand { margin-top: 0; }
  .cand { display: flex; align-items: center; gap: 2.5vh; margin-bottom: 3vh; }
  .cand img { width: 13vh; height: 13vh; border-radius: 1vh; }
  .cand div { flex: 1; min-width: 0; }
  .cand b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 3.4vh; }
  .votes { height: 1.2vh; margin-top: 1.2vh; background: #fff2; border-radius: 1vh; overflow: hidden; }
  .votes i { display: block; height: 100%; background: var(--accent); }
  .count { min-width: 7vh; font-size: 5vh; font-weight: 800; text-align: right; }
  .gap { height: 4vh; }
  .join { position: fixed; right: 8vh; bottom: 4vh; display: flex; align-items: center; gap: 2.5vh; font-size: 2.6vh; text-align: right; color: var(--muted); }
  .join b { color: #fff; }
  #qr { width: 17vh; height: 17vh; overflow: hidden; border-radius: 1.5vh; background: #fff; }
  #qr:empty { display: none; }
  #qr svg { display: block; width: 100%; height: 100%; }
  .credit { position: fixed; left: 8vh; bottom: 4vh; display: flex; gap: 1vh; align-items: center; font-size: 2.2vh; color: var(--muted); }
  .credit svg { width: 3vh; height: 3vh; fill: var(--accent); }
</style>
</head>
<body>
<main><section class="now" id="now"></section><section id="vote"></section><section id="rank"></section></main>
<div class="credit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>Spotify</div>
<div class="join"><div>Scanne pour proposer<br>et voter sur <b id="host"></b></div><div id="qr"></div></div>
<script src="/qrcode.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const mmss = ms => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;
const set = (sel, h) => { const el = $(sel); if (el._h !== h) el.innerHTML = el._h = h; };
const cand = (s, total) => `<div class="cand"><img src="${esc(s.image)}" alt=""><div><b>${esc(s.name)}</b><span class="muted">${esc(s.artists)}</span>`
  + (total == null ? '</div></div>' : `<div class="votes"><i style="width:${total ? s.votes / total * 100 : 0}%"></i></div></div><span class="count">${s.votes}</span></div>`);
$('#host').textContent = location.host;
// QR code vers la page des invités (sans la bibliothèque, il reste l'adresse en clair)
if (window.qrcode) {
  const qr = qrcode(0, 'M');
  qr.addData(location.origin + '/');
  qr.make();
  $('#qr').innerHTML = qr.createSvgTag({ cellSize: 1, margin: 4, scalable: true });
}

let st, at;
async function load() {
  try { st = await (await fetch('/api/state')).json(); at = Date.now(); } catch { return; }
  const { paused, now, next, duel, pool, closesIn, ranking } = st;
  set('#now', paused ? '<h1>Vote en pause</h1>'
    : now ? `<img src="${esc(now.image)}" alt=""><h1>${esc(now.name)}</h1><div class="muted">${esc(now.artists)}</div>`
      + (now.author ? `<div class="by">Proposé par <b>${esc(now.author)}</b></div>` : '') + '<div class="bar"><i id="bar"></i></div>'
    : '<h1 class="muted">En attente de musique…</h1>');
  const pos = []; // les ex aequo partagent la même place
  ranking.forEach((r, i) => pos[i] = i && r.score === ranking[i - 1].score ? pos[i - 1] : i + 1);
  set('#rank', paused ? '' : '<h2>Classement · votes reçus</h2>' + (ranking.length
    ? ranking.slice(0, 6).map((r, i) => `<div class="rank"><span class="pos">${pos[i]}</span><b>${esc(r.name)}</b><span class="pts">${r.score}</span></div>`).join('')
    : '<p class="muted">Propose des sons : chaque vote reçu te fait grimper.</p>'));
  const total = duel?.songs.reduce((n, s) => n + s.votes, duel.reroll ?? 0);
  set('#vote', paused ? '' :
    (next ? `<h2>À suivre</h2>${cand(next)}<div class="gap"></div>` : '')
    + `<h2>Prochain son${closesIn != null ? ' · fin dans <span id="close"></span>' : ''}</h2>`
    + (duel ? duel.songs.map(s => cand(s, total)).join('') + (duel.songs.length < 2 ? "<p class=\"muted\">En attente d'un adversaire…</p>" : '')
        + (duel.reroll ? `<p class="muted">${duel.reroll} vote${duel.reroll > 1 ? 's' : ''} pour deux autres sons</p>` : '')
            : '<p class="muted">Aucune proposition pour le moment.</p>')
    + (pool.length ? `<p class="muted">${pool.length} son${pool.length > 1 ? 's' : ''} en attente</p>` : ''));
  progress();
}

function progress() {
  if (!st?.now || st.paused) return;
  const e = st.now.playing ? Date.now() - at : 0;
  $('#bar').style.width = Math.min(100, (st.now.progress + e) / st.now.duration * 100) + '%';
  if (st.closesIn != null) $('#close').textContent = mmss(Math.max(0, st.closesIn - e));
}

// Empêche l'écran de se mettre en veille pendant la soirée
const wake = () => navigator.wakeLock?.request('screen').catch(() => {});
wake();
document.onvisibilitychange = () => document.visibilityState === 'visible' && wake();

load();
setInterval(load, 3000);
setInterval(progress, 1000);
</script>
</body>
</html>
